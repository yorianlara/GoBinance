{{define "login"}}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Login — mi-bot</title>
  <style>
    :root { --bg: #0f1419; --card: #1a2028; --border: #2a3441; --text: #e6e6e6; --muted: #8a94a6; --accent: #4ade80; --danger: #f87171; }
    * { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .login-card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 2rem; width: 320px; }
    h1 { margin: 0 0 1.5rem; font-size: 1.4rem; }
    label { display: block; font-size: .85rem; color: var(--muted); margin-bottom: .3rem; }
    input { width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--border); padding: .5rem .7rem; border-radius: 4px; margin-bottom: 1rem; font-family: inherit; }
    button { width: 100%; background: var(--accent); color: #0f1419; border: none; padding: .6rem; border-radius: 4px; font-weight: 600; cursor: pointer; }
    button:hover { filter: brightness(1.1); }
    .error { color: var(--danger); font-size: .85rem; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <div class="login-card">
    <h1>mi-bot</h1>
    {{if .Error}}<p class="error">{{.Error}}</p>{{end}}
    <form method="POST" action="/login">
      <label>Usuario</label>
      <input type="text" name="user" required autofocus>
      <label>Contraseña</label>
      <input type="password" name="password" required>
      <button type="submit">Entrar</button>
    </form>
  </div>
</body>
</html>
{{end}}
