{{define "bot-form"}}
<form hx-post="/bots" hx-target="#bot-form-feedback" hx-swap="innerHTML">
  <div class="form-grid">
    <div class="field">
      <label for="bot-id">ID del bot</label>
      <input id="bot-id" type="text" name="id" placeholder="btc-dca-01" autocomplete="off" required>
    </div>
    <div class="field">
      <label for="bot-name">Nombre</label>
      <input id="bot-name" type="text" name="name" placeholder="DCA Bitcoin" required>
    </div>
    <div class="field">
      <label for="bot-strategy">Estrategia</label>
      <select id="bot-strategy" name="strategy_type" required>
        <option value="dca">DCA</option>
        <option value="grid">Grid</option>
        <option value="ema">EMA</option>
        <option value="rsi">RSI</option>
        <option value="noop">Noop (prueba)</option>
      </select>
    </div>
    <div class="field">
      <label for="bot-symbol">Símbolo</label>
      <input id="bot-symbol" type="text" name="symbol" placeholder="BTCUSDT" value="BTCUSDT" autocapitalize="characters" required>
    </div>
    <div class="field">
      <label for="bot-allocation">Asignación (%)</label>
      <input id="bot-allocation" type="number" name="allocation" min="1" max="100" step="0.1" value="20" required>
    </div>
    <div class="field">
      <label for="bot-amount">Importe por orden (USDT)</label>
      <input id="bot-amount" type="number" name="amount_per_buy" min="1" step="0.01" value="20" required>
    </div>
  </div>
  <div class="form-actions">
    <button class="primary" type="submit">Crear bot</button>
    <span class="form-hint">La asignación está sujeta a los límites globales de riesgo.</span>
  </div>
</form>
{{end}}
